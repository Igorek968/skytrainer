services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: skytrainer-qa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sky}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sky}
      POSTGRES_DB: ${POSTGRES_DB:-skytrainer_new}
    volumes:
      - skytrainer_qa_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sky} -d ${POSTGRES_DB:-skytrainer_new}"]
      interval: 5s
      timeout: 5s
      retries: 12
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  redis:
    image: redis:7-alpine
    container_name: skytrainer-qa-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - skytrainer_qa_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  skiinstruct:
    build:
      context: ./skiinstruct
      dockerfile: Dockerfile.qa
      args:
        NEXT_PUBLIC_YANDEX_MAPS_API_KEY: ${NEXT_PUBLIC_YANDEX_MAPS_API_KEY:-${VITE_YANDEX_MAPS_API_KEY:-}}
        YANDEX_GEOCODER_API_KEY: ${YANDEX_GEOCODER_API_KEY:-}
        VITE_YANDEX_MAPS_API_KEY: ${VITE_YANDEX_MAPS_API_KEY:-}
        NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${SKIINSTRUCT_VAPID_PUBLIC_KEY:-}
        NEXT_PUBLIC_YANDEX_METRIKA_ID: ${NEXT_PUBLIC_YANDEX_METRIKA_ID:-}
        NEXT_PUBLIC_SMARTCAPTCHA_CLIENT_KEY: ${NEXT_PUBLIC_SMARTCAPTCHA_CLIENT_KEY:-}
    container_name: skiinstruct-qa-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      DATABASE_URL: ${SKIINSTRUCT_DATABASE_URL:-postgres://sky:sky@postgres:5432/skytrainer_new?schema=skiinstruct}
      AUTH_SECRET: ${SKIINSTRUCT_AUTH_SECRET}
      AUTH_URL: ${APP_PUBLIC_URL:-https://${APP_DOMAIN}}
      NEXTAUTH_SECRET: ${SKIINSTRUCT_AUTH_SECRET}
      NEXTAUTH_URL: ${APP_PUBLIC_URL:-https://${APP_DOMAIN}}
      NEXT_PUBLIC_APP_URL: ${APP_PUBLIC_URL:-https://${APP_DOMAIN}}
      NEXT_SERVER_ACTIONS_ALLOWED_ORIGINS: ${SKIINSTRUCT_SERVER_ACTIONS_ALLOWED_ORIGINS:-${APP_DOMAIN}}
      CRON_SECRET: ${SKIINSTRUCT_CRON_SECRET}
      SKIINSTRUCT_INTERNAL_SCHEDULER: ${SKIINSTRUCT_INTERNAL_SCHEDULER:-1}
      AUTH_GOOGLE_ID: ${SKIINSTRUCT_AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${SKIINSTRUCT_AUTH_GOOGLE_SECRET:-}
      SKIINSTRUCT_ADMIN_EMAIL: ${SKIINSTRUCT_ADMIN_EMAIL}
      SKIINSTRUCT_ADMIN_PASSWORD: ${SKIINSTRUCT_ADMIN_PASSWORD}
      SKIINSTRUCT_ADMIN_NAME: ${SKIINSTRUCT_ADMIN_NAME:-QA Администратор}
      SKIINSTRUCT_MODERATOR_EMAIL: ${SKIINSTRUCT_MODERATOR_EMAIL:-}
      SKIINSTRUCT_MODERATOR_PASSWORD: ${SKIINSTRUCT_MODERATOR_PASSWORD:-}
      SKIINSTRUCT_MODERATOR_NAME: ${SKIINSTRUCT_MODERATOR_NAME:-Модератор}
      STRIPE_SECRET_KEY: ${SKIINSTRUCT_STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${SKIINSTRUCT_STRIPE_WEBHOOK_SECRET:-}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${SKIINSTRUCT_VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${SKIINSTRUCT_VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${SKIINSTRUCT_VAPID_SUBJECT:-mailto:you@example.com}
      PASSWORD_RESET_EMAIL_FROM: ${SKIINSTRUCT_PASSWORD_RESET_EMAIL_FROM:-}
      SMTP_FROM: ${SKIINSTRUCT_SMTP_FROM:-}
      PASSWORD_RESET_EMAIL_SUBJECT: ${SKIINSTRUCT_PASSWORD_RESET_EMAIL_SUBJECT:-}
      SKIINSTRUCT_PASSWORD_RESET_DEBUG: ${SKIINSTRUCT_PASSWORD_RESET_DEBUG:-0}
      ALLOW_MOCK_CHECKOUT: ${ALLOW_MOCK_CHECKOUT:-0}
      ALLOW_MOCK_CHECKOUT_PROD: ${ALLOW_MOCK_CHECKOUT_PROD:-0}
      NEXT_PUBLIC_SMARTCAPTCHA_CLIENT_KEY: ${NEXT_PUBLIC_SMARTCAPTCHA_CLIENT_KEY:-}
      SMARTCAPTCHA_SERVER_KEY: ${SMARTCAPTCHA_SERVER_KEY:-}
      SMARTCAPTCHA_REQUIRED: ${SMARTCAPTCHA_REQUIRED:-0}
      CAPTCHA_REQUIRED: ${CAPTCHA_REQUIRED:-0}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-1}
      YOOKASSA_WEBHOOK_VERIFY_IP: ${YOOKASSA_WEBHOOK_VERIFY_IP:-1}
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_SUPPORT_USER_ID: ${MAX_SUPPORT_USER_ID:-}
      MAX_SUPPORT_CHAT_ID: ${MAX_SUPPORT_CHAT_ID:-}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      BOT_API_SECRET: ${BOT_API_SECRET:-}
      BOT_OUTBOUND_WEBHOOK_BASE_URL: ${BOT_OUTBOUND_WEBHOOK_BASE_URL:-http://channel-bot:8787}
      NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-tvoitrenerrf@yandex.ru}
      NEXT_PUBLIC_SUPPORT_MAX_URL: ${NEXT_PUBLIC_SUPPORT_MAX_URL:-https://max.ru/id110116757261_bot}
      NEXT_PUBLIC_SUPPORT_TELEGRAM_URL: ${NEXT_PUBLIC_SUPPORT_TELEGRAM_URL:-https://t.me/tvoitrenerrf}
      SMTP_HOST: ${SKIINSTRUCT_SMTP_HOST:-}
      SMTP_PORT: ${SKIINSTRUCT_SMTP_PORT:-465}
      SMTP_SECURE: ${SKIINSTRUCT_SMTP_SECURE:-1}
      SMTP_USER: ${SKIINSTRUCT_SMTP_USER:-}
      SMTP_PASSWORD: ${SKIINSTRUCT_SMTP_PASSWORD:-}
      NEXT_PUBLIC_YANDEX_MAPS_API_KEY: ${NEXT_PUBLIC_YANDEX_MAPS_API_KEY:-${VITE_YANDEX_MAPS_API_KEY:-}}
      YANDEX_GEOCODER_API_KEY: ${YANDEX_GEOCODER_API_KEY:-}
      NEXT_PUBLIC_YANDEX_METRIKA_ID: ${NEXT_PUBLIC_YANDEX_METRIKA_ID:-}
    volumes:
      # Фото инструкторов — bind-mount, чтобы переживали деплой и sync-instructors-to-vps.ps1
      - ./deploy/skiinstruct-uploads:/app/public/uploads
      # Паспорт / НПД / страховка — иначе private/uploads пропадает при пересборке образа
      - ./deploy/skiinstruct-private-uploads:/app/private/uploads
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1: alpine wget → localhost часто идёт на ::1, а next слушает IPv4 → ложный unhealthy
      test: ["CMD-SHELL", "wget -q -S -O - http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 8
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "7"

  channel-bot:
    build:
      context: ./channel-bot
      dockerfile: Dockerfile
    container_name: skytrainer-qa-channel-bot
    restart: unless-stopped
    # РФ-VPS: обычный DNS api.telegram.org часто таймаутит; фиксируем рабочий IPv4.
    extra_hosts:
      - "api.telegram.org:149.154.167.220"
    volumes:
      - ./skiinstruct/public/brand:/brand:ro
    environment:
      PORT: "8787"
      BOT_API_SECRET: ${BOT_API_SECRET:-}
      BOT_TOKEN: ${BOT_TOKEN:-}
      CHANNEL_ID: ${CHANNEL_ID:-@tvoitrenerrf}
      SITE_URL: ${SITE_URL:-https://xn--b1agaovdpdkd.xn--p1ai}
      PROVOD_API_KEY: ${PROVOD_API_KEY:-}
      PROVOD_BASE_URL: ${PROVOD_BASE_URL:-https://api.provod.ai}
      TEXT_MODEL: ${TEXT_MODEL:-openai/gpt-5.4}
      IMAGE_MODEL: ${IMAGE_MODEL:-google/gemini-3.1-flash-image}
      LOGO_WATERMARK_FILE: /brand/logo-tvoytrener-official.png
      NODE_OPTIONS: "--dns-result-order=ipv4first"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  caddy:
    image: caddy:2-alpine
    container_name: skytrainer-qa-caddy
    restart: unless-stopped
    depends_on:
      skiinstruct:
        condition: service_started
    environment:
      APP_DOMAIN: ${APP_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./${CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      # Сертификаты LE: bind-mount, чтобы переживали деплой (см. scripts/caddy-sync-certs.ps1)
      - ./deploy/caddy-data:/data
      - ./deploy/caddy-config:/config
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  skytrainer_qa_pg:
  skytrainer_qa_redis:
