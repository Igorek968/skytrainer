# По умолчанию поднимаются postgres, redis и skiinstruct (без legacy API).
# Чтобы собрать и запустить также сервис api: docker compose --profile with-api up -d --build
services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: skytrainer-postgres
    environment:
      POSTGRES_USER: sky
      POSTGRES_PASSWORD: sky
      POSTGRES_DB: skytrainer_new
    ports:
      - "5432:5432"
    volumes:
      - skytrainer_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sky -d skytrainer_new"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: skytrainer-redis
    ports:
      - "6379:6379"
    volumes:
      - skytrainer_redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles:
      - with-api
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: skytrainer-api
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://sky:sky@postgres:5432/skytrainer_new
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-min-32-chars-docker-compose-skytrainer}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
      APP_RETURN_URL: ${APP_RETURN_URL:-http://твойтренер.рф/client/orders}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
      PLATFORM_FEE_PERCENT: "15"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  skiinstruct:
    build:
      context: ./skiinstruct
      dockerfile: Dockerfile
    container_name: skiinstruct-web
    ports:
      - "3001:3000"
    expose:
      - "3000"
    env_file:
      - .env
    environment:
      # Платформенный TZ: тренировки и админка в МСК
      TZ: Europe/Moscow
      # prod = next start (быстро на :8000). dev = hot-reload, медленно в Docker на Windows.
      SKIINSTRUCT_NEXT_MODE: ${SKIINSTRUCT_NEXT_MODE:-prod}
      SKIINSTRUCT_FORCE_REBUILD: ${SKIINSTRUCT_FORCE_REBUILD:-0}
      # В dev-режиме entrypoint сам ставит NODE_ENV=development (next dev + production ломает Tailwind).
      SKIINSTRUCT_NODE_ENV: ${SKIINSTRUCT_NODE_ENV:-}
      # true только в dev на Windows (см. SKIINSTRUCT_USE_POLLING в .env); в prod выключено — меньше нагрузка на CPU.
      WATCHPACK_POLLING: ${SKIINSTRUCT_USE_POLLING:-false}
      CHOKIDAR_USEPOLLING: ${SKIINSTRUCT_USE_POLLING:-false}
      NEXT_TELEMETRY_DISABLED: "1"
      # Меньше фоновых запросов в Docker — страницы не «висят» из-за опроса API.
      NEXT_PUBLIC_DISABLE_NEARBY_POLL: "1"
      NEXT_PUBLIC_DISABLE_DEV_POLL: "1"
      # 0 — очередь в /admin/moderation; 1 — сразу «Опубликовано» без админки
      SKIINSTRUCT_AUTO_APPROVE_EVENTS: ${SKIINSTRUCT_AUTO_APPROVE_EVENTS:-0}
      # Локальная отладка сброса пароля: 1 в .env без SMTP; на VPS — 0
      SKIINSTRUCT_PASSWORD_RESET_DEBUG: ${SKIINSTRUCT_PASSWORD_RESET_DEBUG:-0}
      DATABASE_URL: ${SKIINSTRUCT_DATABASE_URL:-postgres://sky:sky@postgres:5432/skytrainer_new?schema=skiinstruct}
      AUTH_SECRET: ${SKIINSTRUCT_AUTH_SECRET:-replace-with-long-random-secret}
      # Локально по умолчанию :3001; на VPS задайте SKIINSTRUCT_AUTH_URL / SKIINSTRUCT_PUBLIC_APP_URL в .env
      AUTH_URL: ${SKIINSTRUCT_AUTH_URL:-http://localhost:3001}
      NEXTAUTH_SECRET: ${SKIINSTRUCT_AUTH_SECRET:-replace-with-long-random-secret}
      NEXTAUTH_URL: ${SKIINSTRUCT_AUTH_URL:-http://localhost:3001}
      NEXT_PUBLIC_APP_URL: ${SKIINSTRUCT_PUBLIC_APP_URL:-http://localhost:3001}
      # Доп. хосты для Server Actions (CSRF), через запятую
      NEXT_SERVER_ACTIONS_ALLOWED_ORIGINS: ${SKIINSTRUCT_SERVER_ACTIONS_ALLOWED_ORIGINS:-}
      CRON_SECRET: ${SKIINSTRUCT_CRON_SECRET:-replace-with-long-random-secret}
      # 1 — встроенный планировщик push-напоминаний (уроки + мероприятия), без внешнего cron
      SKIINSTRUCT_INTERNAL_SCHEDULER: ${SKIINSTRUCT_INTERNAL_SCHEDULER:-1}
      AUTH_GOOGLE_ID: ${SKIINSTRUCT_AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${SKIINSTRUCT_AUTH_GOOGLE_SECRET:-}
      SKIINSTRUCT_ADMIN_EMAIL: ${SKIINSTRUCT_ADMIN_EMAIL:-}
      SKIINSTRUCT_ADMIN_PASSWORD: ${SKIINSTRUCT_ADMIN_PASSWORD:-}
      SKIINSTRUCT_ADMIN_NAME: ${SKIINSTRUCT_ADMIN_NAME:-Администратор}
      STRIPE_SECRET_KEY: ${SKIINSTRUCT_STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${SKIINSTRUCT_STRIPE_WEBHOOK_SECRET:-}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      # 0 — реальная ЮKassa; 1 — mock без ключей (только локальная отладка, задайте в .env)
      ALLOW_MOCK_CHECKOUT: ${ALLOW_MOCK_CHECKOUT:-0}
      REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-0}
      YOOKASSA_WEBHOOK_VERIFY_IP: ${YOOKASSA_WEBHOOK_VERIFY_IP:-0}
      # За Caddy reverse proxy
      TRUSTED_PROXY_COUNT: ${TRUSTED_PROXY_COUNT:-1}
      NEXT_PUBLIC_VAPID_PUBLIC_KEY: ${SKIINSTRUCT_VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${SKIINSTRUCT_VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${SKIINSTRUCT_VAPID_SUBJECT:-mailto:you@example.com}
      PASSWORD_RESET_EMAIL_WEBHOOK_URL: ${SKIINSTRUCT_PASSWORD_RESET_EMAIL_WEBHOOK_URL:-}
      PASSWORD_RESET_EMAIL_FROM: ${SKIINSTRUCT_PASSWORD_RESET_EMAIL_FROM:-}
      SMTP_FROM: ${SKIINSTRUCT_SMTP_FROM:-}
      PASSWORD_RESET_EMAIL_SUBJECT: ${SKIINSTRUCT_PASSWORD_RESET_EMAIL_SUBJECT:-}
      SMTP_HOST: ${SKIINSTRUCT_SMTP_HOST:-}
      SMTP_PORT: ${SKIINSTRUCT_SMTP_PORT:-465}
      SMTP_SECURE: ${SKIINSTRUCT_SMTP_SECURE:-1}
      SMTP_USER: ${SKIINSTRUCT_SMTP_USER:-}
      SMTP_PASSWORD: ${SKIINSTRUCT_SMTP_PASSWORD:-}
      # Секреты только в корневом .env (не в этом файле!). См. skiinstruct/SUPPORT_SETUP.md
      MAX_BOT_TOKEN: ${MAX_BOT_TOKEN:-}
      MAX_SUPPORT_USER_ID: ${MAX_SUPPORT_USER_ID:-}
      MAX_SUPPORT_CHAT_ID: ${MAX_SUPPORT_CHAT_ID:-}
      MAX_WEBHOOK_SECRET: ${MAX_WEBHOOK_SECRET:-}
      NEXT_PUBLIC_SUPPORT_EMAIL: ${NEXT_PUBLIC_SUPPORT_EMAIL:-}
      NEXT_PUBLIC_SUPPORT_MAX_URL: ${NEXT_PUBLIC_SUPPORT_MAX_URL:-}
      # Яндекс.Карты + геокодер (см. skiinstruct/docs/YANDEX_MAPS.md)
      NEXT_PUBLIC_YANDEX_MAPS_API_KEY: ${NEXT_PUBLIC_YANDEX_MAPS_API_KEY:-${VITE_YANDEX_MAPS_API_KEY:-}}
      NEXT_PUBLIC_YANDEX_METRIKA_ID: ${NEXT_PUBLIC_YANDEX_METRIKA_ID:-}
    volumes:
      # Локальные правки в коде сразу видны в контейнере (без полной пересборки образа).
      - ./skiinstruct/src:/app/src
      - ./skiinstruct/public:/app/public
      - ./skiinstruct/private:/app/private
      - ./skiinstruct/next.config.mjs:/app/next.config.mjs:ro
      # Иначе в контейнере остаётся старый schema.prisma из образа — db:push не добавит новые поля (birthDate и т.д.).
      - ./skiinstruct/prisma:/app/prisma
      # Entrypoint с хоста — не нужен rebuild образа при смене prod/dev.
      - ./skiinstruct/scripts/docker-dev-entrypoint.sh:/app/scripts/docker-dev-entrypoint.sh:ro
      # Кэш Next (.next) не удалять при каждом старте — иначе первый заход ждёт минуты компиляции.
      - skiinstruct_next_cache:/app/.next
    # Первый запуск с пустой БД: SKIINSTRUCT_RUN_SEED=1 docker compose up -d --build
    command: sh -c "tr -d '\\r' < /app/scripts/docker-dev-entrypoint.sh | sh -s"
    depends_on:
      postgres:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    container_name: skytrainer-caddy
    restart: unless-stopped
    depends_on:
      skiinstruct:
        condition: service_started
    ports:
      - "80:80"
    volumes:
      - ./${CADDYFILE:-Caddyfile.domain}:/etc/caddy/Caddyfile:ro
      - ./deploy/caddy-data:/data
      - ./deploy/caddy-config:/config

  # Быстрый публичный HTTPS без VPS/DNS: docker compose --profile tunnel up -d cloudflared-quick
  cloudflared-quick:
    image: cloudflare/cloudflared:latest
    container_name: skytrainer-tunnel-quick
    restart: unless-stopped
    profiles:
      - tunnel
    depends_on:
      skiinstruct:
        condition: service_started
    command: tunnel --no-autoupdate --protocol http2 --url http://skiinstruct:3000
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

  # Постоянный домен твойтренер.рф: CLOUDFLARE_TUNNEL_TOKEN в .env → profile tunnel-named
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: skytrainer-tunnel
    restart: unless-stopped
    profiles:
      - tunnel-named
    depends_on:
      skiinstruct:
        condition: service_started
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    command: tunnel --no-autoupdate run
    logging:
      driver: json-file
      options:
        max-size: 5m
        max-file: "3"

volumes:
  skytrainer_pg:
  skytrainer_redis:
  skiinstruct_next_cache:
