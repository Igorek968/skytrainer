services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    container_name: skytrainer-postgres
    environment:
      POSTGRES_USER: sky
      POSTGRES_PASSWORD: sky
      POSTGRES_DB: skytrainer_new
    ports:
      - "5432:5432"
    volumes:
      - skytrainer_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sky -d skytrainer"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:7-alpine
    container_name: skytrainer-redis
    ports:
      - "6379:6379"
    volumes:
      - skytrainer_redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: skytrainer-api
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://sky:sky@postgres:5432/skytrainer
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-change-me-min-32-chars-docker-compose-skytrainer}
      PUBLIC_API_URL: ${PUBLIC_API_URL:-http://localhost:3000}
      APP_RETURN_URL: ${APP_RETURN_URL:-http://localhost:5173/payment-return}
      YOOKASSA_SHOP_ID: ${YOOKASSA_SHOP_ID:-}
      YOOKASSA_SECRET_KEY: ${YOOKASSA_SECRET_KEY:-}
      FCM_SERVER_KEY: ${FCM_SERVER_KEY:-}
      PLATFORM_FEE_PERCENT: "15"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: skytrainer-frontend
    ports:
      - "5173:5173"
    env_file:
      - .env
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
      VITE_YANDEX_MAPS_API_KEY: ${VITE_YANDEX_MAPS_API_KEY:-}
    depends_on:
      - api

volumes:
  skytrainer_pg:
  skytrainer_redis:
