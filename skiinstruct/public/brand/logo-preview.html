<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Логотип Твой Тренер</title>
  <style>
    body { margin:0; font-family: system-ui, sans-serif; background:#f4f6f8; color:#1a1a1a; padding:32px 20px; }
    h1 { font-size:1.25rem; margin:0 0 8px; }
    p { color:#667085; margin:0 0 24px; }
    .card { background:#fff; border-radius:16px; padding:24px; margin:0 auto 20px; max-width:920px; box-shadow:0 8px 24px rgb(0 0 0 / 6%); }
    h2 { margin:0 0 16px; font-size:.9rem; color:#667085; text-transform:uppercase; letter-spacing:.04em; }
    .stage { display:flex; align-items:center; justify-content:center; min-height:180px; border:1px solid #e8ebf0; border-radius:12px; padding:28px; background:#fff; }
    .stage.dark { background:#0f172a; border-color:#1e293b; }
    img { max-width:100%; height:auto; display:block; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Официальный логотип Твой Тренер</h1>
    <p>Единственный эталон: logo-tvoytrener-official (PNG + SVG). Wordmark: «Твой Тренер» с пробелом.</p>
  </div>
  <div class="card">
    <h2>PNG</h2>
    <div class="stage"><img src="logo-tvoytrener-official.png" alt="логотип PNG" /></div>
  </div>
  <div class="card">
    <h2>SVG (вектор)</h2>
    <div class="stage"><img src="logo-tvoytrener-official.svg" alt="логотип SVG" /></div>
  </div>
  <div class="card">
    <h2>Только знак</h2>
    <div class="stage dark"><img src="logo-mark.svg" alt="знак" style="height:96px" /></div>
  </div>
</body>
</html>
